name: Azupay
kind: company
description: 'Azupay is an Australian real-time payments company that moves money over the New Payments
  Platform (NPP), the account-to-account rails operated by Australian Payments Plus. It is API-first:
  merchants and platforms embed Azupay to receive payments via PayID (AzupayId), send outbound payments
  to a PayID or BSB/account number (AzupayOut), and collect recurring or on-demand debits through PayTo
  mandates and payment agreements (AzupayTo). Azupay also offers Confirmation of Payee (CoP) account checks
  and PayID enquiry to reduce misdirected-payment and fraud risk, batch/file (ABA and SFTP) processing
  for bulk payouts and collections, reporting, balance management, sub-client and API-key management,
  and hosted UX apps (Pay by Bank, Disbursements, Subscriptions). Its public developer portal documents
  a REST API at api.azupay.com.au/v1 with a UAT environment, authenticated by API key (secret and distributable
  keys in the Authorization header) with OAuth 2.0 client-credentials available as an additional server-to-server
  option, plus webhooks for asynchronous payment status. Home market is Australia; the surface is genuinely
  self-serve and documented, though production access and some capabilities (sub-clients, OAuth2) are
  enabled per client by Azupay.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Australia
- Real-Time Payments
- Account-to-Account
- New Payments Platform
- PayID
- PayTo
- Money Transfer
- Confirmation of Payee
- Open Banking

apis:
- aid: azupay:azupay-payment-request-api
  name: Azupay PaymentRequest API (AzupayId)
  description: Receive real-time account-to-account payments from customers by creating PayID-addressed
    payment requests. Create, retrieve, search, delete, and refund PaymentRequests; poll payment status
    to confirm the customer has paid. Supports dynamic and static PayIDs. Part of Azupay's AzupayId receive
    product.
  humanURL: https://developer.azupay.com.au/docs/receiving-payments
  baseURL: https://api.azupay.com.au/v1
  tags:
  - Payments
  - PayID
  - Receive Payments
  - Real-Time Payments
  properties:
  - type: OpenAPI
    url: openapi/azupay-payment-request.yml
  - type: Documentation
    url: https://developer.azupay.com.au/docs/receiving-payments
  - type: APIReference
    url: https://developer.azupay.com.au/reference/createpayidpaymentrequest
  - type: Overlay
    url: overlays/azupay-payment-request-overlay.yaml
- aid: azupay:azupay-payment-api
  name: Azupay Payment API (AzupayOut)
  description: Send outbound NPP payments to a PayID or to a BSB and account number, then poll for settlement
    status. Search prior payments. Part of Azupay's AzupayOut disbursement/payout product for real-time
    money movement.
  humanURL: https://developer.azupay.com.au/docs/making-payments
  baseURL: https://api.azupay.com.au/v1
  tags:
  - Payments
  - Payouts
  - Disbursements
  - Account-to-Account
  properties:
  - type: OpenAPI
    url: openapi/azupay-payment.yml
  - type: Documentation
    url: https://developer.azupay.com.au/docs/making-payments
  - type: APIReference
    url: https://developer.azupay.com.au/reference/makepayment
  - type: Overlay
    url: overlays/azupay-payment-overlay.yaml
- aid: azupay:azupay-payment-agreement-api
  name: Azupay PaymentAgreement & Initiation API (AzupayTo / PayTo)
  description: Establish and manage PayTo payment agreements and initiate eligible debits against them.
    Create, amend, change status, and search agreements; create payment agreement requests; schedule payments;
    initiate, refund, search, and retrieve payment initiations. Azupay's AzupayTo mandated-debit product
    built on NPP PayTo.
  humanURL: https://developer.azupay.com.au/docs/payto-integration-guide
  baseURL: https://api.azupay.com.au/v1
  tags:
  - Payments
  - PayTo
  - Recurring Payments
  - Mandates
  - Direct Debit
  properties:
  - type: OpenAPI
    url: openapi/azupay-payment-agreement.yml
  - type: Documentation
    url: https://developer.azupay.com.au/docs/payto-integration-guide
  - type: APIReference
    url: https://developer.azupay.com.au/reference/createpaymentagreement
  - type: Overlay
    url: overlays/azupay-payment-agreement-overlay.yaml
- aid: azupay:azupay-check-accounts-api
  name: Azupay Account Check API (Confirmation of Payee)
  description: Reduce misdirected-payment and fraud risk with real-time account checks. Confirm a payee's
    BSB/account number and name via Confirmation of Payee (CoP), check whether an account issuer can receive
    NPP or AzupayTo payments by BSB, and verify PayID registration and reachability.
  humanURL: https://developer.azupay.com.au/docs/account-check-cop
  baseURL: https://api.azupay.com.au/v1
  tags:
  - Payments
  - Confirmation of Payee
  - Fraud
  - Account Verification
  properties:
  - type: OpenAPI
    url: openapi/azupay-check-accounts.yml
  - type: Documentation
    url: https://developer.azupay.com.au/docs/account-check-cop
  - type: APIReference
    url: https://developer.azupay.com.au/reference/checkaccountdetails
  - type: Overlay
    url: overlays/azupay-check-accounts-overlay.yaml
- aid: azupay:azupay-reports-api
  name: Azupay Report & Balance API
  description: Retrieve daily transaction reports by month or date range, obtain time-limited download
    links for reports, and check the current balance of an Azupay client account.
  humanURL: https://developer.azupay.com.au/docs/report-api
  baseURL: https://api.azupay.com.au/v1
  tags:

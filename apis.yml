  - type: Overlay
    url: overlays/azupay-reports-overlay.yaml
- aid: azupay:azupay-configuration-api
  name: Azupay Clients & API Key Management API
  description: Manage the platform configuration for an Azupay integration. Create, replace, and disable
    sub-clients; provision, retrieve, and update API keys for sub merchants; enable and read OAuth 2.0
    configuration; and manage low-balance alert thresholds and recipients. Several operations are enabled
    per client by Azupay.
  humanURL: https://developer.azupay.com.au/docs/clients-api
  baseURL: https://api.azupay.com.au/v1
  tags:

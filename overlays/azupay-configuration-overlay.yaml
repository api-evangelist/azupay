overlay: 1.0.0
info:
  title: API Evangelist enhancements for Azupay Azupay Configuration API
  version: 1.0.0
extends: openapi/azupay-configuration.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-24'
    x-apievangelist-provider: azupay
    x-apievangelist-idempotency: Client-supplied clientTransactionId / clientRefundID act as natural idempotency
      keys; duplicates return 409.
    x-apievangelist-webhooks: Asynchronous payment status delivered via webhooks (see conventions/ and
      asyncapi/).
